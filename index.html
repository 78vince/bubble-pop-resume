<script>
  /* 在畫面繪製前決定主題與語言，避免閃爍 */
  (function () {
    var d = document.documentElement, t = null, l = null;

</script>

<main id="main">

      <i class="ring float" data-speed="-0.5" style="--c:var(--candy-sky);width:120px;height:120px;left:42%;bottom:18%;--dx:-20px;--dy:-24px"></i>
    </div>
    <div class="container hero-grid">
      <div class="hero-copy">
        <span class="chip status"><i class="dot"></i><span data-t="status">接案中</span></span>
        <h1 aria-label="Hi, I'm Vincent. 郭慶禮"><span class="line" aria-hidden="true">Hi, I'm</span><span class="line hl" aria-hidden="true">Vincent.</span></h1>
        <p class="name"><b>郭慶禮</b><span>Vincent Kuo</span></p>

        </div>
        <a class="scroll-hint" href="#about"><i></i><span data-t="scroll">往下滑</span></a>
      </div>
      <div class="orbit-stage" id="orbit">
        <div class="layer" data-depth="0.7"><div class="orbit o2"><i style="--c:var(--candy-mint);width:22px;height:22px;left:10%;top:8%"></i><i style="--c:var(--candy-orange);width:16px;height:16px;left:48%;bottom:-8px"></i></div></div>

        </div>
      </div>
      <div>

  <!-- ============ Contact ============ -->

    <div class="big-circle" aria-hidden="true"></div>
    <div class="container">
      <span class="eyebrow">Contact</span>

      <div class="email" id="emailBox">
        <a id="emailLink" href="#"></a>
        <button class="icon-btn" id="copyBtn" aria-label="複製 email" data-t-aria="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <span class="toast" role="status" aria-live="polite" id="toast"></span>
      </div>
      <div class="contact-links" id="contactLinks"></div>
      <footer class="foot">
        <span>© <span id="year">2026</span> Vincent Kuo · bubble-pop</span>
        <button class="icon-btn" id="toTop" aria-label="回到頂端" data-t-aria="toTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </footer>
    </div>
  </section>
